# Tether — embeddable SSH terminal components.
#
# Crates appear here only when they have work to do. An empty crate would be
# a layer added "because it may be useful later", which the specification
# forbids (§22).
[workspace]
resolver = "3"
members = [
    "crates/tether-terminal",
    "crates/tether-ssh",
    "crates/tether-local",
    "crates/tether-core",
    "crates/tether-ffi",
    "crates/tether-tmux",
    "crates/tether-files",
    "crates/tether-render",
    "crates/tether-ui",
    "desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/tether/tether"

[workspace.dependencies]
# Engines are composed, never rewritten (spec §2, §5).
#
# russh crypto is target-specific (`aws-lc-rs` was measured on Apple; on `*-pc-windows-msvc` its `aws-lc-sys` build wants NASM, which is
# not in the toolchain contract). `ring` is russh's own fallback feature and
# is what Windows uses until that gate is re-measured. See tether-ssh.
russh = { version = "0.63", default-features = false, features = ["flate2", "rsa"] }
portable-pty = "0.9"
alacritty_terminal = "0.26"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
thiserror = "2"
tracing = "0.1"
# 0.31, not 0.32: `uniffi-bindgen-cs` v0.11.0+v0.31.0 is the current C#
# generator, and 0.32's metadata is not readable by it ("Invalid string
# data"). The C# projection is what a WinUI consumer binds (Decisions/0018),
# so the generator version is the pin. Revisit when uniffi-bindgen-cs
# publishes a 0.32 pairing.
uniffi = "0.31"
async-trait = "0.1"
tokio-util = "0.7"
# Presentation stack, composed (spec §4, Decisions/0016). cosmic-text is
# reached through glyphon's re-export — one copy in the graph.
#
# DX12 is on: gpu-allocator 0.28 shares windows 0.62 with wgpu-hal.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "gles", "metal"] }
glyphon = "0.12"
bytemuck = { version = "1", features = ["derive"] }

# Zed's GPUI, at Zed's latest stable release tag (Decisions/0022). Both lines
# move together; `scripts/bump-gpui.py` moves them. GPUI is not on crates.io
# past 0.2.2, which predates the platform crates, so the tag is the version.
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.27.0", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.27.0" }

# The xcframework is a release build. Thin LTO and stripped symbols are what
# ship; debug builds stay unoptimised so tests stay quick. Line tables keep
# a panic readable. Full DWARF is most of a debug compile, and the tests
# never read it.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = "symbols"
