# Setup, then one `scripts/check.py --job windows` (see ci.yml). The only job
# a Mac cannot run before a push; `scripts/ship.py` waits for it.
name: Windows
on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install -r scripts/check-requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache saves nothing after an exact match: the key moves when
          # what the build makes does. Not with check.py, or every edit to
          # the gate starts every job cold.
          key: ${{ hashFiles('scripts/build-xcframework.sh') }}
      - name: Restore the C# binding generator
        id: bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-v0.11.0+v0.31.0-${{ runner.os }}
      - name: Install the C# binding generator
        if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install --locked uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.11.0+v0.31.0
      - name: Check
        run: python scripts/check.py --job windows
      - uses: actions/upload-artifact@v4
        with:
          name: Tether-win-x64
          path: artifacts/windows-portable/Tether-win-x64.zip
          compression-level: 0
