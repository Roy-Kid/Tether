# Setup, then one `scripts/check.py --job windows-tests` (see ci.yml): the
# tests a Mac cannot run before a commit, on every push to dev or master.
# Tests only; the lint and the package run nightly in ci.yml.
name: Windows
on:
  push:
    branches: [dev, master]
  workflow_dispatch:
jobs:
  windows-tests:
    name: windows-tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache saves nothing after an exact match: the key moves when
          # what the build makes does. Not with check.py, or every edit to
          # the gate starts every job cold.
          key: ${{ hashFiles('scripts/build-xcframework.sh') }}
      - name: Check
        run: python scripts/check.py --job windows-tests
