# The gate that would have caught `tether-core` calling two functions that no
# longer existed: the workspace compiled per-crate, but nothing ever built it
# whole. Every check here is one CLAUDE.md or the specification already claims
# is true — a claim nothing runs is a claim that drifts.
name: CI

on:
  push:
    branches: [master, windows-app]
  pull_request:
  # The fuzzers find in an hour what they will not find in a minute. Every
  # push gets a short pass; the night gets a long one.
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: build, test, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/check-requirements.txt

      - uses: Swatinem/rust-cache@v2

      # The shaping regression exercises actual CJK glyph advances. Minimal
      # Linux runners otherwise shape missing-glyph placeholders at zero width.
      - name: Install fonts for terminal shaping tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk

      - name: Shared source, Rust and boundary gate
        run: python3 scripts/check.py --common-only

  apple:
    name: aws-lc-rs for Apple targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest stable toolchain and iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Phase 0 asks whether `aws-lc-rs` builds for Apple targets from cargo
      # alone. That question is answered by trying, on every change, not once.
      - name: Build for device and simulator
        run: |
          cargo build -p tether-ffi --target aarch64-apple-ios
          cargo build -p tether-ffi --target aarch64-apple-ios-sim

      - name: Build Apple artifacts and generated bindings
        run: ./scripts/tether.sh --build-xcframework

      # Everything Swift the repository holds: the facade, the frontend, the
      # built-in plugins — how the plugin seam is exercised by something real
      # (Decisions/0012) — and the app, which links nothing from outside.
      - name: Swift facade, frontend, plugin and app tests
        run: |
          python3 scripts/check.py --apple-only

  fuzz:
    name: fuzz the parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `cargo-fuzz` needs nightly and a sanitizer; the rest of this workspace
      # stays on stable, which is why `fuzz/` is its own workspace.
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo install cargo-fuzz --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfuzz -> target"

      # A minute a target on a push — enough to replay every input that has
      # failed before and to catch a regression. Ten on the nightly schedule,
      # which is where something new is actually found.
      - name: Fuzz
        run: ./scripts/tether.sh --fuzz ${{ github.event_name == 'schedule' && 600 || 60 }}

      # A crash is worth keeping even when the job fails: it is the input a
      # fix has to be written against.
      - name: Keep whatever crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
