# One job, on a push to master: `linux`, which is setup and one
# `scripts/check.py --job linux` (`scripts/test-check.py` holds it to that).
# Nothing runs on dev, on a schedule, or on another platform. Every other
# gate job runs on the machine that can: the Mac ones before a push, the
# Windows ones on Windows, fuzz with nightly Rust (see docs/commit-checks.md).
name: CI

on:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python3 -m pip install -r scripts/check-requirements.txt
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache saves nothing after an exact match: the key moves when
          # what the build makes does. Not with check.py, or every edit to
          # the gate starts every job cold.
          key: ${{ hashFiles('scripts/build-xcframework.sh') }}
      # The shaping regression measures actual CJK glyph advances.
      - name: Install fonts for terminal shaping tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk
      - name: Check
        run: python3 scripts/check.py --job linux
