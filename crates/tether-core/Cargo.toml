[package]
name = "tether-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Session orchestration and the public API a consumer imports."

[dependencies]
tether-terminal = { path = "../tether-terminal" }
tether-ssh = { path = "../tether-ssh" }
tether-local = { path = "../tether-local" }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha1 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
async-trait = { workspace = true }
# The in-process fake host in tether-ssh's test support is a russh server.
# Tests only: russh types still stop at tether-ssh's public surface (§8).
russh = { workspace = true }
bytes = "1"
